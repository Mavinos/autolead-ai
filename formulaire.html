<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contactez-nous — AutoLead AI</title>
<style>
  :root{--ink:#172033;--muted:#778099;--line:#e8ebf3;--brand:#5b5ce2}
  *{box-sizing:border-box}
  body{margin:0;background:#f4f6fb;color:var(--ink);font:15px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}
  .card{background:#fff;border-radius:16px;padding:32px;max-width:480px;width:100%;box-shadow:0 20px 60px #18203a12}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
  label{display:block;font-size:12px;font-weight:700;margin-top:14px}
  input,textarea{width:100%;font:inherit;padding:11px;border-radius:9px;border:1px solid var(--line);margin-top:6px}
  textarea{resize:vertical;min-height:70px}
  .consent{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:12px;color:var(--muted);font-weight:400}
  .consent input{width:auto;margin:2px 0 0}
  .consent a{color:var(--brand)}
  button{margin-top:20px;width:100%;border:0;border-radius:9px;padding:13px;font-weight:700;font-size:14px;background:var(--brand);color:#fff;cursor:pointer}
  button:disabled{opacity:.6;cursor:not-allowed}
  .msg{margin-top:14px;font-size:13px;padding:10px 12px;border-radius:8px;display:none}
  .msg.ok{display:block;background:#e9f9f0;color:#0e9f6e}
  .msg.err{display:block;background:#fdeceb;color:#c0392b}
  .hp{position:absolute;left:-9999px;opacity:0}
</style>
</head>
<body>
  <div class="card">
    <h1>Une question, un projet ?</h1>
    <div class="sub">Laissez-nous vos coordonnées, nous revenons vers vous rapidement.</div>
    <form id="leadForm">
      <label>Nom<input id="fName" required></label>
      <label>Email<input id="fEmail" type="email" required></label>
      <label>Entreprise (optionnel)<input id="fCompany"></label>
      <label>Téléphone (optionnel)<input id="fPhone" type="tel"></label>
      <label>Votre message (optionnel)<textarea id="fMessage" placeholder="Décrivez brièvement votre besoin…"></textarea></label>
      <input class="hp" id="fHoneypot" tabindex="-1" autocomplete="off">
      <label class="consent"><input type="checkbox" id="fConsent" required> J'accepte que mes informations soient utilisées pour être recontacté(e) au sujet de ma demande, conformément à la <a href="politique-de-confidentialite.html" target="_blank">politique de confidentialité</a>.</label>
      <button id="submitBtn" type="submit">Envoyer ma demande</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
  <script>
    document.getElementById('leadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');
      msg.className = 'msg';
      btn.disabled = true; btn.textContent = 'Envoi en cours…';
      try {
        const res = await fetch('/api/submit-lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('fName').value.trim(),
            email: document.getElementById('fEmail').value.trim(),
            company: document.getElementById('fCompany').value.trim(),
            phone: document.getElementById('fPhone').value.trim(),
            message: document.getElementById('fMessage').value.trim(),
            consent: document.getElementById('fConsent').checked,
            honeypot: document.getElementById('fHoneypot').value
          })
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || 'Erreur inconnue');
        msg.textContent = 'Merci ! Votre demande a bien été envoyée.';
        msg.className = 'msg ok';
        document.getElementById('leadForm').reset();
      } catch (err) {
        msg.textContent = 'Erreur : ' + err.message;
        msg.className = 'msg err';
      } finally {
        btn.disabled = false; btn.textContent = 'Envoyer ma demande';
      }
    });
  </script>
</body>
</html>
